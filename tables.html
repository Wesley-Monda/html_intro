<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <h1>Table Example</h1>
    <table border="1">
        <tr>
            <th>NAME</th>
            <th>AGE</th>
            <th>CITY</th>
        </tr>
        <tr>
            <td>JOHN</td>
            <td>25</td>
            <td>NEW YORK</td>
        </tr>
        <tr>
            <td>JANE</td>
            <td>30</td>
            <td>PARIS</td>
        </tr>
        <tr>
            <td>BOB</td>
            <td>35</td>
            <td>TOKYO</td>
        </tr>
    </table>
</body>
</html>
