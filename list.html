<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }
    h1 {
        color: #333;
    }
    ul, ol {
        margin-left: 20px;
    }
</style>
<body>
    <h1>List of Cities</h1>
    <!--unordered list-->
    <ul>
        <li>London</li>
        <li>Paris</li>
        <li>Tokyo</li>
        <li>New York</li>
        <li>Sydney</li>
    </ul>

    <ol type="i">
        <li>First Item</li>
        <li>Second Item</li>
        <li>Third Item</li>
        <li>Fourth Item</li>
        <li>Fifth Item</li>
    </ol>
</body>
</html>
